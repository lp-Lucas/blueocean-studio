  { const e = $('#agL2'), on = t >= 3.76; acende(e, t, 3.76); e.style.transform = on ? `scale(${1 + 0.03 * pulso(t, 3.76, 0.5)})` + tranco(t, 3.8) : '';

  { const on = t >= 11.82, n = conta(t, 11.82, 1.6, 0, 29); $('#dcP').className = 'pill num ' + (on ? 'verm' : 'cinza');
    $('#dcP').innerHTML = (on ? '<i></i>' : '') + `${n} cobranças manuais`; $('#dcP').style.transform = `scale(${1 + 0.08 * pulso(t, 13.97, 0.45)})` + tranco(t, 14.0); }

  /* ── tela cheia 2 ── */

  A($('#gn'), t, 21.85, 24.85, { de: 0.86, dy: -60, dout: 0.3 });
  { const p0 = pr(t, 22.2, 0.9, E.cubicInOut), p1 = pr(t, 23.14, 0.9, E.cubicInOut);

    $('#gnB1').style.width = L(25, 100, p1) + '%'; $('#gnV1').textContent = `+${Math.round(L(0, 12, p1))} h`;
    $('#gn1').style.background = `rgba(21,128,61,${0.08 * pulso(t, 23.14, 1.2)})`; }

  /* ── CTA ── */
  cta(t, cur, 25.0, 27.15);

  confete(t);
  legenda(t);
};
