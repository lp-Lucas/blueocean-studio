<!doctype html>
<!-- Logo IMME recriado em vetor a partir da placa da foto do site (porque-imme-2.png): símbolo "S" de duas fitas
     em degradê ciano → roxo + "IMME" vazado em contorno + "Tecnologia". Não há arquivo do logo publicado no site. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'SG'; font-weight: 300 700; src: url('fonts/SpaceGrotesk.woff2'); }
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url('fonts/Inter.woff2'); }
html, body { margin: 0; background: transparent; }
svg { position: absolute; left: 0; top: 0; }
</style></head><body>
<svg id="lg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4E8"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  </defs>
  <g transform="translate(20,20)">
    <!-- símbolo: duas fitas formando o S (a de baixo passa por cima) -->
    <mask id="corte" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="260">
      <rect x="-20" y="-20" width="200" height="260" fill="#fff"/>
      <path d="M30 88 C 104 112, 104 172, 30 212" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round"/>
    </mask>
    <path mask="url(#corte)" d="M96 12 C 20 40, 14 96, 92 128" fill="none" stroke="url(#ga)" stroke-width="20" stroke-linecap="round"/>
    <path d="M30 88 C 104 112, 104 172, 30 212" fill="none" stroke="url(#gb)" stroke-width="20" stroke-linecap="round"/>
    <!-- IMME vazado -->
    <text x="138" y="182" font-family="SG" font-weight="700" font-size="200" letter-spacing="6" fill="none" stroke="TINTA" stroke-width="7" stroke-linejoin="round">IMME</text>
    <text x="604" y="236" font-family="Inter" font-weight="600" font-size="36" fill="TINTA" text-anchor="end">Tecnologia</text>
  </g>
</svg>
<script>
const p = new URLSearchParams(location.search); const cor = (window.PARAMS && PARAMS.cor) || '#0B0B10';
document.getElementById('lg').innerHTML = document.getElementById('lg').innerHTML.replaceAll('TINTA', cor);
if (window.PARAMS && PARAMS.bg) document.body.style.background = PARAMS.bg; window.DURACAO = 0.1; window.quadro = async () => { await document.fonts.ready; };
</script></body></html>
