/* ── ajudas ── */
const pulso = (t, tc, forca = 30) => forca * Math.exp(-(((t - tc) / 0.045) ** 2));
const pisca = t => Math.floor(t * 2.2) % 2 === 0;
const centro = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
function pop(el, t, t0, esc0 = 0.3) {
  const p = M.prog(t, t0, 0.7, E.spring), pa = pr(t, t0, 0.15, E.cubicOut);
  el.style.opacity = t < t0 ? 0 : pa; el.style.transform = `scale(${L(esc0, 1, p)})`; return p;
}
/* peça da interface entrando no lugar dela (e saindo em b) */
function parte(el, t, a, b, o = {}) {
  const { dx = 0, dy = 0, s0 = 0.96, desf = 12, din = 0.7, dout = 0.4, ox = 0, base = '' } = o;
  if (t < a || (b != null && t > b + dout)) { el.style.opacity = 0; return 0; }
  const p = pr(t, a, din), pa = pr(t, a, din * 0.45, E.cubicOut), po = b == null ? 0 : pr(t, b, dout, E.cubicIn);
  el.style.opacity = pa * (1 - po);
  el.style.transform = `${base} translate(${(1 - p) * dx + po * ox}px, ${(1 - p) * dy}px) scale(${L(s0, 1, p)})`;
  const bl = (1 - p) * desf + po * desf; el.style.filter = bl > 0.3 ? `blur(${bl}px)` : 'none';
  return pa * (1 - po);
}
/* troca de etapa: a nova entra deslizando da direita, a velha sai para a esquerda (rápida) */
const etapa = (el, t, a, b) => parte(el, t, a, b, { dx: 46, s0: 0.98, desf: 10, din: 0.55, dout: 0.2, ox: -40 });
function aperta(el, t, tc, k0 = 0.1) { const k = Math.sin(C((t - tc) / 0.2) * Math.PI); el.style.transform = `scale(${1 - k0 * k})`; el.style.filter = k > 0 ? `brightness(${1 + k * 0.4})` : ''; }
function digita(el, txt, t, a, b, ph = '') {
  if (t < a) { el.innerHTML = ph ? `<span class="ph">${ph}</span>` : ''; return; }
  const n = Math.round(C((t - a) / (b - a)) * txt.length);
  el.innerHTML = txt.slice(0, n) + (t < b + 0.25 || pisca(t) ? '<span class="car"></span>' : '');
}
/* número que rola para cima quando muda */
function rola(el, t, mud) {   // mud = [[t, valor], ...] em ordem
  let v0 = 0, v1 = 0, tc = -9; for (const [tt, v] of mud) if (t >= tt) { v0 = v1; v1 = v; tc = tt; }
  const p = pr(t, tc, 0.35, E.cubicOut);
  el.innerHTML = p < 1 ? `<span style="top:${-p * 18}px">${v0}</span><span style="top:${(1 - p) * 18}px">${v1}</span>` : `<span style="top:0">${v1}</span>`;

/* grade de bolinhas (fundo da marca, igual ao app do editor) */
const bg = $('#bolinhas').getContext('2d'), NIV = 24, PASSO = 26, K = 1.3;
const tons = (rgb, [a0, a1]) => Array.from({ length: NIV }, (_, i) => `rgba(${rgb.join(',')},${(a0 + (a1 - a0) * i / (NIV - 1)).toFixed(3)})`);
const CLAROS = tons([82, 135, 255], [0.08, 0.75]), ESCUROS = tons([30, 60, 160], [0.04, 0.24]);
function bolinhas(t) {
  bg.clearRect(0, 0, 1080, 1920);
  for (let y = -PASSO; y < 1920 + PASSO; y += PASSO) for (let x = -PASSO; x < 1080 + PASSO; x += PASSO) {
    const X = x / K, Y = y / K;
    const a = Math.sin(X * 0.011 + t * 0.7) + Math.sin(Y * 0.0085 - t * 0.5) + Math.sin((X - Y) * 0.0065 + t * 0.32), v = a / 3;
    const dx = 5.5 * K * Math.sin(Y * 0.021 + t * 1.05 + a * 0.7), dy = 5.5 * K * Math.cos(X * 0.019 - t * 0.85 + a * 0.7);
    const k = Math.min(NIV - 1, Math.floor(Math.abs(v) * NIV));
    bg.fillStyle = v > 0 ? CLAROS[k] : ESCUROS[k];
    bg.beginPath(); bg.arc(x + dx, y + dy, (1.15 + Math.abs(v) * 0.75) * K * 1.15, 0, 6.2832); bg.fill();
  }
}

  [29.00, 255, 160, 2.15, 900, 2, 3],      // fica: Designer e Editor recebem
];
const CLIQUES = [3.55, 4.25, 5.95, 6.75, 7.55, 9.05, 11.55, 12.85, 21.9, 22.5, 24.05];
const MERGULHO = 29.05;
function camera(t) {
  const n = CAM.length; let c;
  if (t <= CAM[0][0]) c = CAM[0].slice(1); else if (t >= CAM[n - 1][0]) c = CAM[n - 1].slice(1);
  else {
    let i = 0; while (CAM[i + 1][0] <= t) i++;
    const P = k => CAM[Math.max(0, Math.min(n - 1, k))], h = CAM[i + 1][0] - CAM[i][0], s = (t - CAM[i][0]) / h;
    const h00 = 2 * s ** 3 - 3 * s ** 2 + 1, h10 = s ** 3 - 2 * s ** 2 + s, h01 = -2 * s ** 3 + 3 * s ** 2, h11 = s ** 3 - s ** 2;
    c = [1, 2, 3, 4, 5, 6].map(j => {
      const v = k => j === 3 ? Math.log(P(k)[j]) : P(k)[j];
      // tangente monotônica (Fritsch–Carlson): a câmera não passa do alvo
      const sec = k => (v(k + 1) - v(k)) / (P(k + 1)[0] - P(k)[0]);

      return j === 3 ? Math.exp(r) : r;

  for (const tc of CLIQUES) S *= 1 + 0.03 * Math.sin(C((t - tc) / 0.4) * Math.PI);   // empurra leve no clique
  if (t > MERGULHO) S *= L(1, 4.2, E.cubicIn(C((t - MERGULHO) / 0.26)));   // mergulho no fim
  return { fx, fy, S, sy, rx, ry };
}
function aplicaCam(t) {
  const c = camera(t), c0 = camera(t - 1 / 30);
  $('#mundo').style.transform = `translate(540px, ${c.sy}px) perspective(1700px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) scale(${c.S}) translate(${-c.fx}px, ${-c.fy}px)`;

  const bx = Math.min(1.0, Math.abs(dx) * 0.03 + dz * 0.02), by = Math.min(1.0, Math.abs(dy) * 0.03 + dz * 0.02) + (t > MERGULHO ? 8 * C((t - MERGULHO) / 0.26) : 0);
