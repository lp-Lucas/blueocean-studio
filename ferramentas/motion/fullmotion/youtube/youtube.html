    RES.forEach((d, i) => { const p = pr(t, q.res + 0.04 + i * 0.07, 0.65), pa = pr(t, q.res + 0.04 + i * 0.07, 0.25, E.cubicOut);
      d.style.opacity = i === 0 && pg === 'watch' ? 0 : pa; d.style.transform = `translateY(${(1 - p) * 90}px)`; });
    $('#chips').style.opacity = pr(t, q.res, 0.3, E.cubicOut); $('#chips').style.transform = `translateY(${(1 - pr(t, q.res, 0.5)) * 30}px)`;
    // mouse em cima da 1ª thumb: a prévia começa a tocar (como no site)
    const hov = pr(t, q.clk - 0.42, 0.2, E.cubicOut), pv = RES[0].querySelector('.prev');
    pv.style.opacity = hov; pv.dataset.c = hov > 0 ? q.clip : '';
    RES[0].querySelector('.mini').style.width = hov > 0 ? (t - q.clk + 0.42) * 22 + '%' : '0';
    RES[0].querySelector('.dur').style.opacity = 1 - hov;
    RES[0].querySelector('.th').style.transform = `scale(${1 - 0.02 * Math.sin(C((t - q.clk) / 0.18) * Math.PI)})`;
  } else { res.style.opacity = 0; res.style.display = 'none'; RES[0].querySelector('.prev').dataset.c = ''; }
  $('#pgHome').style.opacity = pg === 'home' ? 1 : 0;
  $('#guia').style.opacity = pg === 'watch' ? 0 : 1;

  // página do vídeo
  const w = $('#pgWatch');
  if (kw >= 0) {
    poeVideo(kw);
    const q = Q[kw], pm = E.cubicInOut(C((t - q.m) / 0.42));
    w.style.opacity = 1; w.style.display = '';
    // a thumb clicada cresce até virar o player
    const pl = $('#player');
    pl.style.left = L(455, 16, pm) + 'px'; pl.style.top = L(122, 68, pm) + 'px'; pl.style.width = L(500, 1344, pm) + 'px'; pl.style.height = L(281, 756, pm) + 'px';
    $('#ctrl').style.opacity = $('#barra').style.opacity = $('#botoes').style.opacity = pr(t, q.m + 0.3, 0.3, E.cubicOut);
    [['#wTit', 0.18], ['#wCanal', 0.24], ['#acoes', 0.28], ['#desc', 0.32], ['#comTopo', 0.36], ['#addCom', 0.38], ['#coms', 0.4], ['#rel', 0.22]].forEach(([s, d]) => {
      const el = $(s), p = pr(t, q.m + d, 0.6), pa = pr(t, q.m + d, 0.25, E.cubicOut);
      el.style.opacity = pa; el.style.transform = `translateY(${(1 - p) * 40}px)`; });
    $('#relLista').querySelectorAll('.r').forEach((r, i) => { const p = pr(t, q.m + 0.26 + i * 0.04, 0.6); r.style.opacity = pr(t, q.m + 0.26 + i * 0.04, 0.25, E.cubicOut); r.style.transform = `translateX(${(1 - p) * 60}px)`; });
    // play: o ícone do centro (bezel) cresce e some
    { const b = $('#bezel'), p = C((t - q.m - 0.38) / 0.5); b.style.opacity = t < q.m + 0.38 ? 0 : 0.9 * (1 - E.cubicIn(p)); b.style.transform = `scale(${L(1, 2.1, E.cubicOut(p))})`; }
    progresso(kw, t);
    // comentários rolando (só na música); volta ao topo para a próxima busca
    const rol = kw === 2 ? (L(0, 700, liso(t, 9.62, 10.3)) + Math.max(0, Math.min(t, 11.6) - 10.3) * 150) * (1 - liso(t, 11.55, 11.92)) : 0;
    $('#wRol').style.transform = `translateY(${-rol}px)`;
    // Inscrever-se → Inscrito
    { const ins = $('#insc'), feito = kw === 3 && t >= 14.38; ins.classList.toggle('feito', feito);
      $('#inscTxt').textContent = feito ? 'Inscrito' : 'Inscrever-se'; $('#inscBell').style.display = $('#inscChev').style.display = feito ? '' : 'none';
      const k2 = Math.sin(C((t - 14.36) / 0.2) * Math.PI); ins.style.transform = kw === 3 ? `scale(${1 - 0.06 * k2})` : '';
      const an = $('#anel'); an.style.opacity = feito ? Math.sin(C((t - 14.38) / 0.9) * Math.PI) : 0; an.style.setProperty('--a', `${(t - 14.38) * 400}deg`);
      $('#inscBell').style.transform = feito ? `rotate(${Math.sin((t - 14.4) * 30) * 22 * Math.exp(-(t - 14.4) * 4)}deg)` : ''; }
  } else { w.style.opacity = 0; w.style.display = 'none'; }

  /* campo de busca: foco, seleção do texto antigo, digitação, sugestões */
  { const kb = buscaK(t), q = Q[kb], focado = t >= q.foco && t < q.env + 0.06;
    $('#caixa').classList.toggle('foco', focado);
    let base, sel = false;
    if (t < q.a) { base = kb === 0 ? '' : Q[kb - 1].q; sel = kb > 0 && t >= q.foco + 0.05; }
    else base = q.q.slice(0, Math.floor(nDig(kb, t) + 1e-6));
    const pisca = Math.floor(t * 2.4) % 2 === 0, digitando = t >= q.a && t < q.b + 0.15, comCar = focado && !sel && (digitando || pisca);
    $('#txt').innerHTML = sel ? `<span class="sel">${base}</span>` : base + (comCar ? '<span class="car"></span>' : '') + (base ? '' : '<span class="ph">Pesquisar</span>');
    $('#limpa').style.opacity = t >= q.a + 0.05 || kb > 0 ? 1 : 0;
    // sugestões (parte digitada normal, o resto em negrito, como no site)
    const so = sugAberta(kb, t), sg = $('#sug');
    sg.style.opacity = so; sg.style.transform = `translateY(${(1 - so) * -6}px)`;
    if (so > 0) { const dig = q.q.slice(0, Math.floor(nDig(kb, t))), on = t >= q.env - 0.1;
      const lista = q.sug.map(s => q.q + s).filter(s => s.startsWith(dig)).concat(dig.length < q.q.length ? [] : []);
      sg.innerHTML = lista.map((s, i) => `<div class="s${on && i === 0 ? ' on' : ''}">${svgI(IC.busca)}<span>${s.slice(0, dig.length)}<b>${s.slice(dig.length)}</b></span></div>`).join(''); }
    // lupa apertada (clique na 1ª; Enter nas outras)
    const kp = Math.sin(C((t - q.env + 0.03) / 0.2) * Math.PI); $('#lupa').style.background = kp > 0 ? `rgb(${34 + 30 * kp},${34 + 30 * kp},${34 + 30 * kp})` : '#222222';
  }

  mouse(t);

  /* 5 ─ parede de vídeos → tela limpa → logo */
  { const vis = t > 15.0 && t < 17.9, pa = $('#parede');
    $('#mundo').style.opacity = 1 - pr(t, 15.2, 0.25, E.cubicIn);
    pa.style.opacity = vis ? pr(t, 15.15, 0.3, E.cubicOut) : 0;
    if (vis) {
      const p = C((t - 15.15) / 2.1), s = L(1.12, 0.78, E.cubicOut(p));
      $('#pInner').style.transform = `translate(960px, 560px) rotateX(${L(26, 16, p)}deg) rotateZ(${L(-9, -5, p)}deg) scale(${s}) translate(${L(30, -20, p)}px, ${L(40, -60, p)}px)`;
      TILES.forEach(d => { const a = 15.15 + d._dist * 0.05, pe = pr(t, a, 0.7), pea = pr(t, a, 0.25, E.cubicOut);
        const col = E.cubicIn(C((t - 17.18 - (4 - Math.min(4, d._dist)) * 0.025) / 0.34));
        d.style.opacity = pea * (1 - col);
        d.style.transform = `translate(${L(d._x, -190, col)}px, ${L(d._y, -150, col)}px) translateZ(${(1 - pe) * -400}px) scale(${L(L(0.7, 1, pe), 0.12, col)})`; });
    }
    // tela limpa: o branco abre do centro
    const ab = E.cubicInOut(C((t - 17.32) / 0.42)); $('#fim').style.clipPath = `circle(${ab * 1150}px at 960px 540px)`;
    // logo: o ícone nasce com mola, o nome sai de trás dele; no "play" o triângulo aperta
    const si = M.prog(t, 17.42, 0.9, E.spring), ic = $('#icone');
    const desl = L(320, 0, pr(t, 17.78, 0.8));   // o ícone começa no centro e vai para o lugar quando o nome chega
    ic.style.transform = `translateX(${desl / 10}px) scale(${C(si, 0, 1.3) * (1 - 0.06 * Math.sin(C((t - 18.88) / 0.22) * Math.PI))})`;
    ic.style.opacity = t < 17.42 ? 0 : 1;
    LETRAS.forEach((l, i) => { const p = pr(t, 17.8 + i * 0.05, 0.7), pa = pr(t, 17.8 + i * 0.05, 0.2, E.cubicOut);
      l.style.opacity = pa; l.style.transform = `translateX(${(1 - p) * -14}px)`; l.style.filter = p < 0.98 ? `blur(${(1 - p) * 1.2}px)` : 'none'; });
    const tp = C((t - 18.88) / 0.5); $('#tri').style.transform = t < 18.88 ? '' : `scale(${1 - 0.25 * Math.sin(C(tp / 0.3) * Math.PI) + 0.08 * Math.sin(C((tp - 0.3) / 0.7) * Math.PI)})`;
    { const o = $('#onda'), p = C((t - 18.9) / 0.5); o.style.opacity = t < 18.9 ? 0 : 0.45 * (1 - E.cubicOut(p));
      o.style.transform = `translateX(${desl}px) scale(${L(1, 1.35, E.cubicOut(p))})`; }
  }

  legenda(t);

  /* vídeos tocando: só os visíveis trocam de quadro */
  pend.length = 0;
  document.querySelectorAll('img.clip').forEach(im => {
    const c = im.dataset.c; if (!c) return;
    let el = im, vis = true;
    while (el && el !== document.body) { const cs = el.style; if (cs.opacity === '0' || cs.display === 'none') { vis = false; break; } el = el.parentElement; }
    if (!vis && im._s) return;
    const t0 = im.id === 'pvImg' ? Q[watchK].m + 0.3 : 0, i = Math.floor(Math.max(0, t - t0) * 30) % 120, src = fr(c, i);
    if (im._s !== src) { im._s = src; im.src = src; pend.push(im.decode().catch(() => {})); }
  });
  await Promise.all(pend);
};
window.pronto = document.fonts.load('16px Roboto').then(() => document.fonts.ready).then(() => Promise.all([...document.images, ...cache].map(i => i.decode().catch(() => {}))));
