<script>
const P = Object.assign({ modulo: 'Módulo 1', aula: 'DRE e lucratividade', sub: 'Nos vemos no próximo módulo' }, window.PARAMS || {});
// tipo "fim" = vinheta de fim de módulo (check + "Módulo 1 concluído"); sem tipo = abertura da aula
const FIM = P.tipo === 'fim';
if (FIM) P.aula = P.titulo || `${P.modulo} concluído`;
window.DURACAO = 6.0;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const cubicInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const mola = p => p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(9 * p);           // mola com um leve passar do ponto
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ── tempos (o aulas-sfx.py usa os mesmos) ── */
const T = {
  crista: 0.75,      // o símbolo é revelado (clarão no centro)
  marca: 1.45,       // símbolo vai para a esquerda e entra BLUE OCEAN
  sobe: 2.55,        // logo sobe e diminui
  modulo: 2.85,      // pílula do módulo
  aula: 3.15,        // nome da aula, palavra a palavra
  sai: 5.55,         // tudo sai desfocando
  check: 3.2,        // fim de módulo: o check entra depois que o logo assenta lá em cima
};

/* ── textos ── */
$('#modulo').textContent = P.modulo;
if (FIM) {
  $('#modulo').style.display = 'none'; $('#check').style.display = 'block'; $('#sub').style.display = 'block';
  $('#sub').textContent = P.sub; $('#aula').style.top = '598px'; $('#aula').style.fontSize = '120px';
}
const palavras = P.aula.split(/\s+/);
$('#aula').innerHTML = palavras.map(w => `<span>${w}</span>`).join('');
// título longo: reduz para caber em 1600 px
requestAnimationFrame(() => { const w = $('#aula').scrollWidth, f = parseFloat(getComputedStyle($('#aula')).fontSize); if (w > 1600) $('#aula').style.fontSize = (f * 1600 / w) + 'px'; });

/* ── fundo: azul Blue Ocean liso, com um leve clarão no centro na revelação ── */
const cv = $('#mar'), c = cv.getContext('2d');
// degradê animado: 6 pontos de azuis muito próximos, cada um derivando devagar em órbita própria
const PONTOS = [
  { cor: [0, 40, 215],  x: 300,  y: 220, ax: 300, ay: 180, vx: 0.24, vy: 0.19, f: 0.0 },   // azul profundo
  { cor: [40, 98, 255], x: 1550, y: 200, ax: 280, ay: 200, vx: 0.20, vy: 0.26, f: 1.3 },   // azul claro
  { cor: [20, 30, 230], x: 1700, y: 860, ax: 320, ay: 170, vx: 0.18, vy: 0.22, f: 2.6 },   // puxado pro índigo
  { cor: [1, 55, 255],  x: 960,  y: 560, ax: 360, ay: 220, vx: 0.15, vy: 0.21, f: 3.9 },   // #0137FF da marca
  { cor: [0, 85, 245],  x: 260,  y: 880, ax: 290, ay: 190, vx: 0.25, vy: 0.17, f: 5.1 },   // puxado pro ciano
  { cor: [0, 34, 200],  x: 1150, y: 1040, ax: 340, ay: 140, vx: 0.21, vy: 0.16, f: 0.7 },  // profundo embaixo
];
// versão escura (PARAMS.fundo = "escuro"): o marinho dos banners da linha Blue (motion.js fundoMarinho), com 6 brilhos azuis derivando
// manchas grandes e esticadas (ex, ey), tons perto do marinho; as de cor [2,1,29] escurecem o fundo onde passam
const PONTOS_ESCURO = [
  { cor: [9, 34, 150],  x: 300,  y: 60,   ax: 300, ay: 120, vx: 0.20, vy: 0.17, f: 0.0, a: 0.55, ex: 2.1, ey: 0.9, rot: -0.25 },
  { cor: [7, 28, 125],  x: 200,  y: 1040, ax: 280, ay: 110, vx: 0.18, vy: 0.22, f: 1.3, a: 0.55, ex: 2.3, ey: 0.8, rot: 0.2 },
  { cor: [2, 1, 29],    x: 1250, y: 620,  ax: 360, ay: 180, vx: 0.16, vy: 0.19, f: 2.6, a: 0.7,  ex: 1.8, ey: 1.0, rot: 0.4 },
  { cor: [10, 38, 160], x: 1650, y: 120,  ax: 300, ay: 140, vx: 0.15, vy: 0.21, f: 3.9, a: 0.4,  ex: 2.0, ey: 0.9, rot: 0.3 },
  { cor: [2, 2, 34],    x: 500,  y: 520,  ax: 340, ay: 160, vx: 0.21, vy: 0.16, f: 5.1, a: 0.6,  ex: 2.2, ey: 1.0, rot: -0.15 },
  { cor: [6, 24, 110],  x: 1700, y: 980,  ax: 320, ay: 130, vx: 0.13, vy: 0.18, f: 0.7, a: 0.45, ex: 2.0, ey: 0.9, rot: -0.3 },
];
const ESCURO = P.fundo === 'escuro';
function desenhaFundo(t) {
  if (ESCURO) {
    const lg = c.createLinearGradient(0, 0, 0, 1080);
    lg.addColorStop(0, '#040E46'); lg.addColorStop(0.35, '#030733'); lg.addColorStop(0.65, '#02011D'); lg.addColorStop(1, '#05114F');
    c.fillStyle = lg; c.fillRect(0, 0, 1920, 1080);
    for (const p of PONTOS_ESCURO) {
      const x = p.x + p.ax * Math.sin(t * p.vx * 2 + p.f), y = p.y + p.ay * Math.cos(t * p.vy * 2 + p.f * 1.3), r = 900;
      const [R, G, B] = p.cor, g = c.createRadialGradient(0, 0, 0, 0, 0, r);
      // queda gaussiana (sem borda): a mancha se dissolve no fundo
      for (let i = 0; i <= 16; i++) { const u = i / 16; g.addColorStop(u, `rgba(${R},${G},${B},${Math.exp(-u * u * 4.5) * (1 - u) * p.a})`); }
      c.save(); c.translate(x, y); c.rotate(p.rot + 0.15 * Math.sin(t * 0.3 + p.f)); c.scale(p.ex, p.ey);
      c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r); c.restore();
    }
    return;
  }
  c.fillStyle = '#0237f8'; c.fillRect(0, 0, 1920, 1080);
  for (const p of PONTOS) {
    const x = p.x + p.ax * Math.sin(t * p.vx * 2 + p.f), y = p.y + p.ay * Math.cos(t * p.vy * 2 + p.f * 1.3), r = 900;
    const [R, G, B] = p.cor;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    // queda longa e gradual (vários degraus) para a transição entre as cores não aparecer
    for (let i = 0; i <= 8; i++) { const u = i / 8, a = Math.pow(1 - u, 2.2) * 0.85; g.addColorStop(u, `rgba(${R},${G},${B},${a})`); }
    c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  }
}

/* clarão no centro quando o símbolo aparece */
const cb = $('#brilhos').getContext('2d');
function desenhaBrilhos(t) {
  cb.clearRect(0, 0, 1920, 1080);
  const cl = Math.exp(-Math.pow((t - T.crista - 0.05) / 0.16, 2));
  if (cl > 0.01) {
    const gg = cb.createRadialGradient(960, 540, 0, 960, 540, 760);
    gg.addColorStop(0, `rgba(200,240,255,${0.55 * cl})`); gg.addColorStop(0.4, `rgba(80,170,255,${0.25 * cl})`); gg.addColorStop(1, 'rgba(40,120,255,0)');
    cb.fillStyle = gg; cb.fillRect(0, 0, 1920, 1080);
  }
}

/* grão (determinístico por quadro) */
const cg = $('#grao').getContext('2d'), gImg = cg.createImageData(960, 540);
function grao(t) {
  let sd = Math.floor(t * 30) * 9973 + 17; const px = gImg.data;
  for (let i = 0; i < px.length; i += 4) { sd = (sd * 1103515245 + 12345) & 0x7fffffff; const v = sd & 255; px[i] = px[i + 1] = px[i + 2] = v; px[i + 3] = 255; }
  cg.putImageData(gImg, 0, 0);
}

/* ── elemento entra com mola saindo do desfoque e sai desfocando ── */
function anima(el, t, ini, fim, { dy = 40, esc = 0.9, blur = 14, sai = 0.4 } = {}) {
  const p = prog(t, ini, ini + 0.75), q = prog(t, fim, fim + sai);
  const e = expoOut(p), m = mola(p);
  el.style.opacity = clamp(p * 2.5) * (1 - q);
  el.style.filter = `blur(${blur * (1 - e) + 16 * q}px)`;
  return { y: dy * (1 - m) - 20 * q, s: lerp(esc, 1, m) * (1 - 0.04 * q) };
}

const marcaPaths = [...document.querySelectorAll('#marca path')];
const aulaSpans = [...document.querySelectorAll('#aula span')];

window.quadro = function (t) {
  desenhaFundo(t); desenhaBrilhos(t); grao(t);

  /* símbolo: revelado da esquerda para a direita junto com a crista de luz */
  const sim = $('#simbolo');
  const pr = prog(t, T.crista - 0.28, T.crista + 0.32);
  const rev = -15 + 130 * cubicInOut(pr);
  // a máscara vai na imagem (dentro) e o brilho no contêiner (fora), senão o brilho é cortado num retângulo
  const simImg = sim.firstElementChild;
  simImg.style.webkitMaskImage = simImg.style.maskImage = `linear-gradient(100deg, #000 ${rev - 12}%, transparent ${rev}%)`;
  const ps = prog(t, T.crista - 0.2, T.crista + 0.9), es = expoOut(ps);
  const brilho = Math.exp(-Math.pow((t - T.crista - 0.15) / 0.3, 2));
  const pSai = prog(t, T.sai, T.sai + 0.45);
  sim.style.filter = `blur(${8 * (1 - es) + 16 * pSai}px) drop-shadow(0 0 ${10 + 40 * brilho}px rgba(140,225,255,${0.35 + 0.6 * brilho}))`;
  sim.style.opacity = (pr > 0 ? 1 : 0) * (1 - pSai);

  /* logo: o símbolo começa no centro (maior), depois vai para a esquerda e o BLUE OCEAN entra */
  const pm = cubicInOut(prog(t, T.marca, T.marca + 0.75));
  const pu = cubicInOut(prog(t, T.sobe, T.sobe + 0.8));
  const simX = lerp(0, -240, pm), simS = lerp(1.18 - 0.08 * es, 1, pm);
  sim.style.transform = `translateX(${simX}px) scale(${simS})`;
  const deriva = 1 + 0.02 * prog(t, T.crista, T.sobe);              // aproximação lenta enquanto o logo está sozinho
  const lx = 960 + lerp(0, 240, pm) * 0 , ly = lerp(540, 205, pu);
  $('#logo').style.transform = `translate(${0}px, ${ly - 540}px) scale(${lerp(deriva, 0.36, pu)})`;
  // letras do BLUE OCEAN: B L U E / O C E A N, em cascata
  const ordem = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  marcaPaths.forEach((el, i) => {
    const a = T.marca + 0.25 + ordem[i] * 0.055, p = prog(t, a, a + 0.6), m = mola(p);
    el.style.opacity = clamp(p * 3) * (1 - pSai);
    el.style.transform = `translateY(${10 * (1 - m)}px) scale(${lerp(.6, 1, m)})`;
  });
  $('#marca').style.transform = `translateX(${lerp(0, 0, pm)}px)`;
  $('#marca').style.filter = `blur(${6 * (1 - expoOut(prog(t, T.marca + 0.25, T.marca + 1.0))) + 14 * pSai}px)`;

  /* módulo e aula */
  const mo = anima($('#modulo'), t, T.modulo, T.sai, { dy: 30, esc: 0.85 });
  $('#modulo').style.transform = `translate(-50%, -50%) translateY(${mo.y}px) scale(${mo.s})`;
  const au = $('#aula'); au.style.opacity = 1;
  const t0Aula = FIM ? T.check + 0.45 : T.aula;
  aulaSpans.forEach((el, i) => {
    const a = t0Aula + i * 0.12;
    const r = anima(el, t, a, T.sai + 0.04 * i, { dy: 60, esc: 0.92, blur: 18 });
    el.style.transform = `translateY(${r.y}px) scale(${r.s})`;
  });

  /* fim de módulo: o anel se desenha, o check risca, uma onda de luz sai do círculo */
  if (FIM) {
    const C = T.check, ck = $('#check'), r = anima(ck, t, C - 0.1, T.sai, { dy: 0, esc: 0.6, blur: 10 });
    ck.style.transform = `scale(${r.s})`;
    $('#chkAnel').style.strokeDasharray = '1 1'; $('#chkAnel').style.strokeDashoffset = 1 - cubicInOut(prog(t, C, C + 0.5));
    $('#chkAnel').style.opacity = t > C ? 1 : 0;
    $('#chkV').style.strokeDasharray = '1 1'; $('#chkV').style.strokeDashoffset = 1 - cubicInOut(prog(t, C + 0.4, C + 0.7));
    $('#chkV').style.opacity = t > C + 0.4 ? 1 : 0;
    const po = prog(t, C + 0.7, C + 1.4);
    $('#chkOnda').setAttribute('r', 72 + 60 * expoOut(po)); $('#chkOnda').style.opacity = po > 0 ? 0.8 * (1 - po) : 0;
    const bate = Math.exp(-Math.pow((t - C - 0.75) / 0.12, 2));   // tranco quando o check fecha
    ck.style.transform += ` scale(${1 + 0.08 * bate})`;
    ck.style.filter += ` drop-shadow(0 0 ${18 + 24 * bate}px rgba(0,255,212,${0.25 + 0.4 * bate}))`;
    const sb = anima($('#sub'), t, C + 1.0, T.sai + 0.1, { dy: 24, esc: 0.96, blur: 12 });
    $('#sub').style.transform = `translate(-50%, -50%) translateY(${sb.y}px) scale(${sb.s})`;
  }
};
window.pronto = Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => window.quadro(0));
if (!window.RENDER) { const t0 = performance.now(); (function loop() { window.quadro(((performance.now() - t0) / 1000) % window.DURACAO); requestAnimationFrame(loop); })(); }
</script>
