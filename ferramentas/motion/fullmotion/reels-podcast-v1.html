    const marca = { 0: W('segunda'), 2: W('quarta'), 4: W('sexta') }, motivo = { 0: W('segunda', 2), 2: W('quarta', 2), 4: W('sexta', 2) }, bom = { 1: W('terca'), 3: W('quinta') };
    for (let i = 0; i < 5; i++) {
      const d = $('#d' + i), st = $('#st' + i), mo = $('#mo' + i);
      if (i in marca) {
        const p = M.prog(t, marca[i] - 0.05, 0.6, E.spring);
        st.style.opacity = pr(t, marca[i] - 0.05, 0.15, E.cubicOut); st.style.transform = `scale(${t < marca[i] - 0.05 ? 0 : C(p, 0, 1.15)})`;
        d.style.background = t >= marca[i] ? '#E9EBF1' : '#F2F4F9'; d.querySelector('.nm').style.color = t >= marca[i] ? '#9AA1B5' : 'var(--tinta)';
        mo.style.opacity = pr(t, motivo[i] - 0.05, 0.4, E.cubicOut); mo.style.transform = `translateY(${(1 - pr(t, motivo[i] - 0.05, 0.5)) * 16}px)`;
      } else {
        const p = M.prog(t, bom[i] - 0.05, 0.6, E.spring), on = t >= bom[i] - 0.05;
        st.style.opacity = on ? 1 : 0; st.style.transform = `scale(${on ? C(p, 0, 1.15) : 0})`;
        d.style.background = on ? 'var(--azul)' : '#F2F4F9'; d.querySelector('.nm').style.color = on ? '#fff' : 'var(--tinta)';
        d.style.transform = on ? `translateY(${-14 * C(p, 0, 1.1)}px)` : 'none';
      }
    }
    anim($('#melhor'), t, W('melhor') - 0.1, null, { extra: tranco(t, W('quinta') + 0.2) });
  };
}

window.quadro = async function (t) { await video(t); voos(t); cena(t); confete(t); };
window.pronto = (async () => { await document.fonts.ready; await window.quadro(0); })();
</script>
