<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CTA (identidade) — Programa MVP para SaaS</title>
<link rel="stylesheet" href="../identidade.css">
<style>
  #olho { top: 296px; }
  .selo { display: inline-flex; align-items: center; height: 76px; padding: 6px 34px 0; border-radius: 38px; border: 2.5px solid var(--verde);
    font-family: 'Titulo'; font-size: 50px; letter-spacing: 0.02em; color: var(--verde); text-transform: uppercase; opacity: 0; }
  #titulo { top: 408px; font-size: 128px; }
  #caminho { top: 800px; }
  #caminho svg { width: 920px; height: 170px; overflow: visible; }
  #texto { top: 990px; font-size: 44px; }
  #rodape { top: 1130px; }
  #assin { top: 1338px; }
</style>
</head>
<body>
<canvas id="fundo" width="1080" height="1920"></canvas>

<div class="camada" id="olho"><div class="selo" id="selo">Programa MVP para SaaS</div></div>
<div class="camada titulo" id="titulo"><div id="tit">Se você quer lançar<br>seu SaaS, precisa de<br>um <span class="verde">caminho validado</span></div></div>

<div class="camada" id="caminho">
  <svg viewBox="0 0 920 170">
    <defs>
      <linearGradient id="gl" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#3D6BFF"/><stop offset=".55" stop-color="#3FB5FF"/><stop offset="1" stop-color="#00DEB9"/>
      </linearGradient>
      <filter id="luz" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <path id="trilho" d="M 40 120 C 180 120, 210 50, 330 56 S 520 132, 620 98 S 790 30, 870 46" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
    <path id="linhaLuz" d="M 40 120 C 180 120, 210 50, 330 56 S 520 132, 620 98 S 790 30, 870 46" fill="none" stroke="#00DEB9" stroke-width="14" stroke-linecap="round" filter="url(#luz)" opacity=".45"/>
    <path id="linha" d="M 40 120 C 180 120, 210 50, 330 56 S 520 132, 620 98 S 790 30, 870 46" fill="none" stroke="url(#gl)" stroke-width="6" stroke-linecap="round"/>
    <g id="nos"></g>
    <g id="final">
      <circle r="44" fill="#00DEB9" opacity=".45" filter="url(#luz)"/>
      <circle r="36" fill="#00DEB9"/>
      <path id="check" d="M -14 1 L -4 11 L 15 -10" fill="none" stroke="#08090E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle id="cometa" r="9" fill="#fff"/>
  </svg>
</div>

<div class="camada texto" id="texto"><div id="txt">Clica no link abaixo e veja<br>como funciona o <b>programa</b></div></div>

<div class="camada" id="rodape">
  <div class="cta" id="cta"><span class="brilho"></span><span class="seta">→</span><span>Saiba mais</span></div>
  <div class="chevrons" id="chev">
    <svg viewBox="0 0 54 26"><path d="M6 5 L27 20 L48 5" fill="none" stroke="#00DEB9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 54 26"><path d="M6 5 L27 20 L48 5" fill="none" stroke="#00DEB9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<div class="camada" id="assin">
  <div class="assinatura" id="assinatura"><img class="simb" src="../img/simbolo-blueocean.png"><div class="div"></div><img src="../img/LOGO-BLUE.svg" style="height:54px;filter:invert(1)"></div>
</div>

<script src="../motion.js"></script>
<script>
  const M = Motion, E = M.ease, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  window.DURACAO = 10;
  const desenhaFundo = M.fundoLinhas($('#fundo'));
  const palTit = M.palavras($('#tit')), palTxt = M.palavras($('#txt'));
  const cta = $('#cta'), brilho = $('.brilho'), seta = $('.seta');
  const linha = $('#linha'), luz = $('#linhaLuz'), trilho = $('#trilho'), L = linha.getTotalLength();
  [linha, luz].forEach(p => p.style.strokeDasharray = `${L} ${L}`);
  const PARADAS = [0, 0.34, 0.67];
  const nos = PARADAS.map(f => {
    const pt = linha.getPointAtLength(f * L);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    g.innerHTML = '<circle class="halo" r="22" fill="#00DEB9" opacity="0" filter="url(#luz)"/><circle class="aro" r="13" fill="#08090E" stroke="rgba(255,255,255,.5)" stroke-width="3"/><circle class="miolo" r="7" fill="#00DEB9" opacity="0"/>';
    $('#nos').appendChild(g); return g;
  });
  const pf = linha.getPointAtLength(L);
  const fin = $('#final'), chk = $('#check'), CL = chk.getTotalLength(); chk.style.strokeDasharray = CL;
  window.pronto = Promise.all([...document.images].map(i => i.decode().catch(() => {})));

  function bloco(el, t, t0, { sobe = 40, desf = 18, dur = 1.1, esc = 0.96 } = {}) {
    const p = M.prog(t, t0, dur), pa = M.prog(t, t0, dur * 0.6, E.cubicOut);
    el.style.opacity = pa;
    el.style.filter = p > 0.999 ? 'none' : `blur(${(1 - p) * desf}px)`;
    el.style.transform = `translateY(${(1 - p) * sobe}px) scale(${M.lerp(esc, 1, p)})`;
  }

  window.quadro = function (t) {
    desenhaFundo(t);
    bloco($('#selo'), t, 0.15, { sobe: 30, esc: 0.9 });
    M.entrar(palTit, t, 0.4, { atraso: 0.075, dur: 1.2, sobe: 0.32 });

    // caminho: trilho, linha se desenhando, pontos acendendo, check
    trilho.style.opacity = M.prog(t, 1.9, 0.8, E.cubicOut);
    const pl = M.prog(t, 2.2, 1.9, E.cubicInOut);
    linha.style.strokeDashoffset = L * (1 - pl); luz.style.strokeDashoffset = L * (1 - pl);
    nos.forEach((g, i) => {
      g.querySelector('.aro').setAttribute('opacity', M.prog(t, 1.9 + i * 0.08, 0.6, E.cubicOut));
      const aceso = M.clamp((pl - PARADAS[i]) / 0.06);
      g.querySelector('.miolo').setAttribute('opacity', aceso);
      g.querySelector('.halo').setAttribute('opacity', aceso * 0.7);
      g.querySelector('.miolo').setAttribute('r', 7 * E.spring(aceso));
    });
    const cp = linha.getPointAtLength(L * pl), cometa = $('#cometa');
    cometa.setAttribute('cx', cp.x); cometa.setAttribute('cy', cp.y);
    cometa.setAttribute('opacity', pl > 0 && pl < 1 ? 1 : 0);
    const pfim = M.prog(t, 3.95, 0.9, E.spring);
    fin.setAttribute('transform', `translate(${pf.x},${pf.y}) scale(${Math.max(0, pfim)})`);
    fin.setAttribute('opacity', M.prog(t, 3.95, 0.3, E.cubicOut));
    chk.style.strokeDashoffset = CL * (1 - M.prog(t, 4.25, 0.55, E.cubicInOut));

    M.entrar(palTxt, t, 4.5, { atraso: 0.045, dur: 1.0, sobe: 0.5, desfoque: 14 });

    const pc = M.prog(t, 5.3, 1.1, E.spring), pca = M.prog(t, 5.3, 0.5, E.cubicOut);
    cta.style.opacity = pca;
    cta.style.transform = `translateY(${(1 - Math.min(pc, 1)) * 60}px) scale(${M.lerp(0.85, 1, pc)})`;
    cta.style.filter = pca > 0.999 ? 'none' : `blur(${(1 - pca) * 12}px)`;
    const T0 = 6.2, ciclo = ((t - T0) % 1.6 + 1.6) % 1.6;
    brilho.style.transform = `translateX(${t < T0 ? -200 : M.lerp(-200, 560, E.cubicInOut(M.clamp(ciclo / 0.9)))}px) skewX(-20deg)`;
    seta.style.transform = `translateX(${t < T0 ? 0 : Math.sin(M.clamp(ciclo / 0.6) * Math.PI) * 10}px)`;
    $$('#chev svg').forEach((s, i) => {
      const pe = M.prog(t, 5.9 + i * 0.12, 0.6, E.cubicOut);
      const onda = t < T0 ? 1 : 0.35 + 0.65 * Math.max(0, Math.sin(((t - T0) * 2.4 - i * 0.35) * Math.PI));
      s.style.opacity = pe * onda;
      s.style.transform = `translateY(${(1 - pe) * -14 + (t < T0 ? 0 : Math.sin((t - T0) * 2.4 * Math.PI - i * 0.6) * 4)}px)`;
    });
    bloco($('#assinatura'), t, 5.8, { sobe: 24, desf: 12 });
  };
  M.tocar();
</script>
</body>
</html>
