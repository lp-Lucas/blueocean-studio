<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Soft CS — Peça 04 (custo do cancelamento)</title>
<link rel="stylesheet" href="../fm.css">
<link rel="stylesheet" href="base.css">
<style>
  .conta { display: flex; align-items: center; gap: 18px; padding: 12px 16px; margin: -12px -16px 10px; border-radius: 16px; border-bottom: 1.5px solid var(--linha); position: relative; }
  .conta .av { width: 78px; height: 78px; border-radius: 20px; font-size: 26px; }
  .conta h4 small { display: block; font: 500 21px 'MAN'; color: var(--cinza); margin-top: 2px; letter-spacing: 0; }
  .conta .pill { margin-left: auto; }
  #pSt { height: 52px; padding: 0 20px; font-size: 22px; border: 1.5px solid transparent; transform-origin: 100% 50%; }
  #pSt.cr { border-color: rgba(220,38,38,.35); }
  #pSt svg { width: 20px; height: 20px; }
  .calc { margin-top: 22px; background: #fff; border-radius: 18px; border: 1.5px solid #EEF0F6; padding: 10px 24px 8px; box-shadow: 0 2px 12px rgba(15,23,42,.05); }
  .calc .k { display: flex; align-items: center; gap: 12px; font: 700 18px ui-monospace, Consolas, monospace; letter-spacing: .14em; color: var(--cinza2); padding: 14px 0 6px; }
  .calc .k svg { width: 26px; height: 26px; }
  .lc { display: flex; align-items: center; height: 78px; border-top: 1.5px solid var(--linha); font: 600 26px 'MAN'; color: var(--tinta); white-space: nowrap; opacity: 0; }
  .lc .op { width: 34px; color: var(--cinza2); font-weight: 800; }
  .lc small { font: 500 20px 'MAN'; color: var(--cinza); margin-left: 10px; }
  .lc b { margin-left: auto; font: 800 28px 'MAN'; font-variant-numeric: tabular-nums; }
  .lc.novo { color: var(--verm); overflow: hidden; } .lc.novo .op { color: var(--verm); }
  #tot { display: flex; align-items: center; gap: 16px; margin-top: 18px; height: 112px; padding: 0 26px; border-radius: 18px; background: var(--fundo2); color: #fff; font: 700 26px 'MAN'; }
  #tot b { margin-left: auto; font: 800 48px 'MAN'; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #tot .pill { opacity: 0; }
</style>
</head>
<body>
<svg id="tela" viewBox="0 0 1080 1920"></svg>

<div class="p tit" id="h1" style="left:540px;top:380px" data-tx="Quanto custou|o último cliente|que você [perdeu?]"></div>

<div class="cam" id="cam1">
<div class="p win" id="w1" style="left:540px;top:1110px">
  <div class="bar"><i></i><i></i><i></i><span class="url">softcs.com.br / clientes / grupo-vertice</span></div>
  <div class="corpo">
    <div class="conta"><span class="av a1">GV</span><h4>Grupo Vértice<small>Cliente desde mar/2024 · MRR R$ 12.400</small></h4><span class="pill ok" id="pSt"><i></i>Ativo</span></div>
    <div class="calc">
      <div class="k"><span id="icCalc"></span>CUSTO DO CLIENTE</div>
      <div class="lc" id="l0"><span class="op"></span>Aquisição<small>CAC</small><b id="v0">R$ 8.400</b></div>
      <div class="lc" id="l1"><span class="op">+</span>Onboarding<small>implantação</small><b id="v1">R$ 3.200</b></div>
      <div class="lc" id="l2"><span class="op">+</span>Tempo do CSM<small>14 meses</small><b id="v2">R$ 4.900</b></div>
      <div class="lc novo" id="l3"><span class="op">+</span>Substituir o cliente<small>novo CAC + onboarding</small><b id="v3">R$ 11.600</b></div>
    </div>
    <div id="tot">Total<span class="pill cr" id="p2x"><i></i>pago de novo</span><b id="vT">R$ 0</b></div>
  </div>
</div>
</div>

<div class="p" id="cta" style="left:540px;top:880px">
  <span class="logo" id="ctaL"></span>
  <div class="tit" id="ctaT" data-tx="Descubra quantas|contas estão|[em risco] agora."></div>
  <div class="btn" id="btnCta"><div id="brilho"></div>Ver contas em risco<span id="ctaS"></span></div>
</div>

<svg class="cursor" id="curC" viewBox="0 0 24 30"></svg>
<canvas id="confT" width="1080" height="1920"></canvas>
<div id="legenda"></div>

<script src="../../motion.js"></script>
<script src="../fm.js"></script>
<script src="c4/palavras.js"></script>
<script>
window.DURACAO = 12.22;
const ROSTO = [540, 960], FS = [];
const OCULTA = [[0, 2.7], [8.8, 99]];
const ESTOUROS = [];
</script>
<script src="base.js"></script>
<script src="comum.js"></script>
<script src="softcs.js"></script>
<script>
$('#ctaL').innerHTML = LOGO(104); $('#ctaS').innerHTML = ic('seta', '#fff', 2.6); $('#icCalc').innerHTML = ic('calc', '#94A3B8', 2);
const VERM = '239,68,68';
const TL = [2.75, 3.2, 3.65], TSELO = 4.55, TNOVO = T0(13) - 0.1;
const BR = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');

window.quadro = function (t) {
  FM.antes(t);
  camera(t, '#cam1', [[0, [540, 830], 1, 2, -2], [2.5, [540, 840], 1, 1, -1], [3.2, '.calc', 1.04, -1, 1], [4.3, '.conta', 1.08, 1, -1], [5.6, '.conta', 1.04, -1, 1],
    [6.4, ['#l3', '#tot'], 1.06, 1, 1], [7.6, '#tot', 1.1, -1, -1], [8.8, '#tot', 1.12, 0, 0]]);

  tit('#h1', t, PAL.slice(0, 8).map(w => w[0]), 2.6);
  A($('#w1'), t, -0.45, 8.8, { de: 0.9, dy: 160 });

  // as linhas entram somando; o total conta junto
  const parc = [8400, 3200, 4900, 11600];
  [...TL, TNOVO].forEach((t0, k) => { const l = $('#l' + k);
    if (k === 3) { const ph = pr(t, t0 - 0.15, 0.45, E.cubicInOut); l.style.height = 78 * ph + 'px'; l.style.borderTopWidth = (ph > 0.02 ? 1.5 : 0) + 'px'; l.style.opacity = pr(t, t0, 0.3, E.cubicOut); l.style.transform = `translateX(${(1 - pr(t, t0, 0.5)) * 40}px)`; acende(l, t, t >= t0 ? t0 : null, VERM, 0.08); }
    else { l.style.opacity = L(0.4, 1, pr(t, t0, 0.3, E.cubicOut)); $('#v' + k).textContent = t < t0 ? '—' : BR(parc[k] * E.cubicOut(C((t - t0) / 0.4))); if (t >= t0) pulsa(l.querySelector('b'), t, t0 + 0.4, 0.06); } });
  let tot = 0; [...TL, TNOVO + 0.2].forEach((t0, k) => tot += parc[k] * E.cubicOut(C((t - t0) / (k === 3 ? 0.9 : 0.4))));
  $('#vT').textContent = BR(tot); $('#vT').style.color = t >= TNOVO + 0.2 ? '#FF8A8A' : '';
  if (t >= T0(16)) pulsa($('#vT'), t, T0(16), 0.08);
  { const p = $('#p2x'); p.style.opacity = pr(t, T0(16), 0.3, E.cubicOut); p.style.transform = `scale(${L(0.7, 1, M.prog(t, T0(16), 0.6, E.spring))})`; }

  // carimbo CANCELADO na conta
  vira($('#pSt'), t, TSELO, ic('x', '#DC2626', 3) + 'Cancelado', 'cr');
  if (t >= TSELO) $('#pSt').style.transform = `scale(${1 + 0.18 * Math.sin(C((t - TSELO) / 0.35) * Math.PI)})`;
  acende($('.conta'), t, t >= TSELO ? TSELO : null, '239,68,68', 0.06);
  $('.conta .av').style.filter = t >= TSELO ? `grayscale(${pr(t, TSELO, 0.4)})` : 'none';

  cta(t, 8.85, PAL.slice(17, 24).map(w => w[0]), 11.45, window.DURACAO);

  confete(t);
  legenda(t);
};
fim();
</script>

</html>
