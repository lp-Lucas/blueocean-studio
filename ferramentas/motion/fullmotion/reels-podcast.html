      <div style="display:flex; justify-content:space-between; font-size:28px; font-weight:600; color:#5b6380; margin-top:26px"><span>Mercado alcançado</span><span id="satPct">0%</span></div>
      <div style="height:30px; border-radius:15px; background:#eef0f6; margin-top:10px; overflow:hidden"><div id="satBar" style="height:100%; width:0; background:linear-gradient(90deg,#4C74FF,#0037FF)"></div></div>
      <div id="trav" style="margin-top:20px; font-size:28px; font-weight:700; color:#8a91a8; opacity:0">crescimento travado ↘</div></div>
    ${pil('av1', 170, 'Novo produto', '#fff', 'var(--tinta)', 'var(--azul)', G.seta)}${pil('av2', 290, 'Novo público', '#fff', 'var(--tinta)', 'var(--azul)', G.seta)}${pil('av3', 410, 'Nova persona', 'var(--verde)', '#00281f', '#00281f', G.seta, '#00FFD4')}
    ${pil('cs1', 200, 'Colaborador saindo', '#fff', 'var(--tinta)', '#E5484D', 'M12 5 V19 M6 13 L12 19 L18 13')}${pil('cs2', 320, 'Time insatisfeito', '#fff', 'var(--tinta)', '#E5484D', G.x)}
    <div class="p" id="quem" style="left:540px; top:80px; padding:14px 34px; border-radius:20px; background:var(--azul); font-size:46px; font-weight:700; white-space:nowrap; box-shadow:0 20px 50px rgba(0,20,120,.45)">Quem se preocupa com isso?</div>
    ${pil('q1', 178, 'Gestor de RH', '#fff', 'var(--tinta)', 'var(--navy)', G.pessoa)}${pil('q2', 280, 'CEO', '#fff', 'var(--tinta)', 'var(--navy)', G.pessoa, '#fff', 250)}${pil('q3', 280, 'Gerente operacional', '#fff', 'var(--tinta)', 'var(--navy)', G.pessoa, '#fff', 710)}
    <div class="p" id="teste" style="left:540px; top:80px; padding:14px 34px; border-radius:20px; background:var(--navy); font-size:44px; font-weight:700; white-space:nowrap">Teste de personas</div>
    <div class="p cartao" id="emp" style="left:540px; top:285px; width:900px; padding:34px 44px">
      <div style="font-size:32px; font-weight:600; color:#5b6380">Empresa que já tem gestor de RH</div>
      <div style="display:flex; align-items:baseline; gap:16px"><div id="nE" style="font-size:120px; font-weight:700; letter-spacing:-.05em; line-height:1.05">0</div><div style="font-size:42px; font-weight:700; color:#5b6380">pessoas</div></div>
      <div id="emp2" style="font-size:30px; font-weight:700; color:#00a884; opacity:0">antes disso, quem contrata é o CEO</div></div>
    ${pil('m1', 170, '+ mercado', 'var(--azul)', '#fff', '#fff', 'M12 5 V19 M5 12 H19', '#0037FF')}${pil('m2', 275, '+ demanda', 'var(--azul)', '#fff', '#fff', 'M12 5 V19 M5 12 H19', '#0037FF')}${pil('m3', 380, '+ vendas', 'var(--verde)', '#00281f', '#00281f', 'M12 5 V19 M5 12 H19', '#00FFD4')}`;
  cena = t => {
    hook(t, HK);
    // público saturando
    anim($('#sat'), t, HK + 0.02, W('avenidas') - 0.45);
    const ps = M.prog(t, W('atacando') - 0.1, W('saturar') - W('atacando') + 0.2, E.cubicOut);
    $('#satBar').style.width = 100 * ps + '%'; $('#satPct').textContent = Math.round(100 * ps) + '%';
    $('#satBar').style.background = ps > 0.97 ? '#E5484D' : 'linear-gradient(90deg,#4C74FF,#0037FF)';
    $('#satTag').style.opacity = pr(t, W('saturar'), 0.2, E.cubicOut); $('#satTag').style.transform = `scale(${L(1.6, 1, M.prog(t, W('saturar'), 0.5, E.spring))})`;
    $('#trav').style.opacity = pr(t, W('crescer') - 0.1, 0.4, E.cubicOut);
    // novas avenidas
    for (let i = 1; i <= 3; i++) anim($('#av' + i), t, W('avenidas') - 0.35 + i * 0.15, 9.0);
    // Rony: colaborador saindo / quem se preocupa
    anim($('#cs1'), t, W('saindo') - 0.1, W('sera') - 0.35); anim($('#cs2'), t, W('insatisfeito') - 0.1, W('sera') - 0.35);
    anim($('#quem'), t, W('sera') - 0.1, W('dentro', 2) - 0.3);
    const cks = [W('gestor', 2) - 0.05, W('ceo') - 0.05, W('gerente') - 0.05];
    for (let i = 1; i <= 3; i++) anim($('#q' + i), t, cks[i - 1], i === 2 ? 31.7 : W('ceo', 2) - 0.1);
    anim($('#teste'), t, W('dentro', 2) - 0.1, 31.7);
    const ceoOk = t >= W('ceo', 2) - 0.05;
    $('#q2').style.background = ceoOk ? 'var(--verde)' : '#fff'; $('#q2').style.color = ceoOk ? '#00281f' : 'var(--tinta)';
    if (ceoOk) $('#q2').style.transform += ' translate(' + (290 * pr(t, W('ceo', 2), 0.5, E.cubicInOut)) + 'px,' + (-102 * pr(t, W('ceo', 2), 0.5, E.cubicInOut)) + 'px)' + tranco(t, W('ceo', 2) + 0.1);
    // empresa com gestor de RH
    anim($('#emp'), t, W('empresa', 3) - 0.2, W('consegue') - 0.4);
    const nums = [[W('50'), 50], [W('60'), 60], [W('40'), 40]]; let nE = 0;
    for (const [tt, v] of nums) if (t >= tt - 0.05) nE = v;
    if (t < nums[0][0] - 0.05) nE = Math.max(1, Math.round(50 * M.prog(t, W('empresa', 3) - 0.2, nums[0][0] - W('empresa', 3) + 0.1, E.quintOut)));
    $('#nE').textContent = nE === 40 ? '40+' : nE;
    $('#emp2').style.opacity = pr(t, W('crescer', 2) - 0.1, 0.4, E.cubicOut);
    // + mercado / + demanda / + vendas
    anim($('#m1'), t, W('mercado', 1) - 0.1, null); anim($('#m2'), t, W('demanda') - 0.1, null);
    anim($('#m3'), t, W('vende') - 0.1, null, { extra: tranco(t, W('vende') + 0.15) });
  };
}

const montaHook = () => {   // depois de carregar a Tusker (a largura de cada linha é medida)
  if (REEL === 'comp7') letreiro('LinkedIn não', 'tem empresário', 515);
  if (REEL === 'comp8') letreiro('De 60 mil', 'pra 100 mil', 515);
  if (REEL === 'comp9') letreiro('3 dias que o dono', 'não te responde', 515);
  if (REEL === 'comp10') letreiro('Por que seu SaaS', 'não vende', 515);
  if (REEL === 'comp11') letreiro('Como achar mais', 'mercado pro SaaS', 515);
};
window.quadro = async function (t) { cena(t);   // define o fim do letreiro antes de desenhar o vídeo (recorte já no 1º quadro)
  await video(t); voos(t); cena(t); confete(t); };
window.pronto = (async () => { await document.fonts.load('100px Tusker'); await document.fonts.ready; montaHook(); await window.quadro(0); })();
</script>
