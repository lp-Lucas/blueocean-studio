<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CTA — Escale seu SaaS com a Blue Ocean</title>
<link rel="stylesheet" href="../motion.css">
<style>
  #cabeca { top: 290px; transform-origin: 50% 0; }
  #simbolo { width: 150px; height: auto; margin-bottom: 34px; }
  #titulo { font-size: 124px; }
  #sub { top: 0; font-size: 46px; width: 860px; left: 110px; right: auto; }
  #logos { top: 650px; gap: 92px; }
  #logos img { display: block; opacity: 0; }
  #cases { top: 598px; gap: 18px; }
  .card { width: 920px; height: 152px; border-radius: 40px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px 0 52px; text-align: left; opacity: 0; }
  .card .nome { font-size: 32px; font-weight: 500; color: rgba(255,255,255,.72); letter-spacing: -0.01em; margin-bottom: 6px; }
  .card .res { font-size: 50px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .card .res .num { font-variant-numeric: tabular-nums; }
  .card .res .leve { font-weight: 400; color: rgba(255,255,255,.78); }
  .icone { width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.25); }
  .icone svg { width: 44px; height: 44px; }
  #rodape { top: 1128px; }
</style>
</head>
<body>
<canvas id="fundo" width="1080" height="1920"></canvas>
<div class="palco">
  <div class="camada" id="cabeca">
    <img id="simbolo" class="logo-branco" src="../img/simbolo-blueocean.png">
    <div class="titulo" id="titulo">Escale seu SaaS<br>com a <span class="grad">Blue Ocean</span></div>
  </div>
  <div class="camada sub" id="sub"><div id="subtxt">Descubra a melhor solução de marketing e vendas pro seu software</div></div>

  <div class="camada" id="logos">
    <img class="logo-branco" src="../img/devzapp.svg" style="height:96px">
    <img class="logo-branco" src="../img/greatpages.svg" style="height:62px">
    <img class="logo-branco" src="../img/smarthint.png" style="height:122px">
  </div>

  <div class="camada" id="cases">
    <div class="card vidro">
      <div><div class="nome">Envio Ecom</div>
        <div class="res"><span class="leve">de</span> R$40mil <span class="leve">para</span> R$<span class="num" id="n1">40</span>mil</div></div>
      <div class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="traco" d="M4 17 L10 11 L13.5 14.5 L20 8"/><path class="traco" d="M14.5 8 H20 V13.5"/></svg></div>
    </div>
    <div class="card vidro">
      <div><div class="nome">Tripmee</div>
        <div class="res"><span class="leve">de</span> 13% <span class="leve">para</span> <span class="num" id="n2">13</span>%</div>
        <div class="nome" style="margin:4px 0 0">de qualificação do lead</div></div>
      <div class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="traco" d="M4 17 L10 11 L13.5 14.5 L20 8"/><path class="traco" d="M14.5 8 H20 V13.5"/></svg></div>
    </div>
    <div class="card vidro">
      <div><div class="nome">Acrux Corp</div>
        <div class="res">Time de vendas estruturado</div></div>
      <div class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="traco" d="M5.5 12.5 L10 17 L18.5 7.5"/></svg></div>
    </div>
  </div>

  <div class="camada" id="rodape">
    <div class="cta" id="cta"><span class="brilho"></span><span>Saiba mais</span><span class="seta">→</span></div>
    <div class="chevrons" id="chev">
      <svg viewBox="0 0 54 26"><path d="M6 5 L27 20 L48 5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 54 26"><path d="M6 5 L27 20 L48 5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script src="../motion.js"></script>
<script>
  const M = Motion, E = M.ease, $ = s => document.querySelector(s);
  window.DURACAO = 13.5;
  const desenhaFundo = M.fundo($('#fundo'), { energia: 1, inicio: 3 });
  const palTitulo = M.palavras($('#titulo')), palSub = M.palavras($('#subtxt'));
  const logos = [...document.querySelectorAll('#logos img')], cards = [...document.querySelectorAll('.card')];
  const tracos = [...document.querySelectorAll('.traco')];
  tracos.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.L = L; });
  const cab = $('#cabeca'), sub = $('#sub'), cta = $('#cta'), brilho = $('.brilho'), seta = $('.seta');
  // posição do bloco de abertura (centrado) e encaixe no topo
  const DESCE = 370, ESCALA_TOPO = 0.64;
  window.pronto = Promise.all([...document.images].map(i => i.decode().catch(() => {})));

  function blurIn(el, t, t0, dur = 1.1, sobe = 40, desf = 22, esc = 0.94) {
    const p = M.prog(t, t0, dur), pa = M.prog(t, t0, dur * 0.6, E.cubicOut);
    el.style.opacity = pa; el.style.filter = p > 0.999 ? 'none' : `blur(${(1 - p) * desf}px)`;
    return p;
  }

  window.quadro = function (t) {
    desenhaFundo(t);
    // 1) símbolo + título + sub, centrados
    const ps = blurIn($('#simbolo'), t, 0.15, 1.3);
    $('#simbolo').style.transform = `translateY(${(1 - ps) * 30}px) scale(${M.lerp(0.8, 1, ps)})`;
    M.entrar(palTitulo, t, 0.45, { atraso: 0.085, dur: 1.2 });
    // 2) encaixa no topo (4.0 → 5.0)
    const pd = M.prog(t, 4.0, 1.15, E.quintInOut);
    cab.style.transform = `translateY(${(1 - pd) * DESCE}px) scale(${M.lerp(1, ESCALA_TOPO, pd)})`;
    sub.style.top = (290 + DESCE + cab.offsetHeight + 46) + 'px';
    M.entrar(palSub, t, 1.55, { atraso: 0.035, dur: 1.0, sobe: 0.5, desfoque: 14 });
    M.sair(palSub, t, 3.7, { atraso: 0.012, dur: 0.5 });

    // 3) logos dos clientes (4.7 → 7.5)
    logos.forEach((img, i) => {
      const t0 = 4.75 + i * 0.16;
      const p = blurIn(img, t, t0, 1.2, 0, 20);
      const ps = M.prog(t, 7.35 + i * 0.05, 0.5, E.cubicIn);
      img.style.opacity = M.prog(t, t0, 0.7, E.cubicOut) * (1 - ps);
      if (ps > 0) img.style.filter = `blur(${ps * 18}px) brightness(0) invert(1)`;
      else img.style.filter = (p > 0.999 ? '' : `blur(${(1 - p) * 20}px) `) + 'brightness(0) invert(1)';
      img.style.transform = `translateY(${(1 - p) * 50 - ps * 30}px) scale(${M.lerp(0.92, 1, p)})`;
    });

    // 4) cases (7.8 →)
    cards.forEach((c, i) => {
      const t0 = 7.8 + i * 0.2;
      const p = M.prog(t, t0, 1.2), pa = M.prog(t, t0, 0.7, E.cubicOut);
      c.style.opacity = pa;
      c.style.transform = `translateY(${(1 - p) * 70}px) scale(${M.lerp(0.94, 1, p)})`;
      c.style.filter = p > 0.999 ? 'none' : `blur(${(1 - p) * 16}px)`;
    });
    M.contar($('#n1'), t, 8.5, 1.5, 40, 200);
    M.contar($('#n2'), t, 8.7, 1.5, 13, 70);
    tracos.forEach((p, i) => {
      const k = i < 2 ? 0 : i < 4 ? 1 : 2;
      const pr = M.prog(t, 8.6 + k * 0.2 + (i % 2) * 0.25, 0.8, E.cubicInOut);
      p.style.strokeDashoffset = p.dataset.L * (1 - pr);
    });

    // 5) CTA (10.3 →): entra com mola, depois brilho passando e a seta "chamando"
    const pc = M.prog(t, 10.3, 1.1, E.spring), pca = M.prog(t, 10.3, 0.5, E.cubicOut);
    cta.style.opacity = pca;
    cta.style.transform = `translateY(${(1 - Math.min(pc, 1)) * 60}px) scale(${M.lerp(0.85, 1, pc)})`;
    cta.style.filter = pca > 0.999 ? 'none' : `blur(${(1 - pca) * 12}px)`;
    const ciclo = ((t - 11.2) % 1.6 + 1.6) % 1.6;
    brilho.style.transform = `translateX(${t < 11.2 ? -200 : M.lerp(-200, 560, E.cubicInOut(M.clamp(ciclo / 0.9)))}px) skewX(-20deg)`;
    const pul = t < 11.2 ? 0 : Math.sin(M.clamp(ciclo / 0.6) * Math.PI);
    seta.style.transform = `translateX(${pul * 12}px)`;
    // setas para baixo (apontam o botão do anúncio), acendendo em sequência
    [...document.querySelectorAll('#chev svg')].forEach((s, i) => {
      const pe = M.prog(t, 10.9 + i * 0.12, 0.6, E.cubicOut);
      const onda = t < 11.4 ? 1 : 0.35 + 0.65 * Math.max(0, Math.sin(((t - 11.4) * 2.4 - i * 0.35) * Math.PI));
      s.style.opacity = pe * onda;
      s.style.transform = `translateY(${(1 - pe) * -14 + (t < 11.4 ? 0 : Math.sin((t - 11.4) * 2.4 * Math.PI - i * 0.6) * 4)}px)`;
    });
  };
  M.tocar();
</script>
</body>
</html>
