<script>
window.DURACAO = 7.0;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const expoOut = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const cubicInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

/* ── câmera: pontos-chave + curva de Hermite (velocidade contínua, para no fim) ── */
const KEYS = [
  { t: 0.0, cx: 880, cy: 470, s: 2.55, ry: -9, rx: 5 },
  { t: 1.4, cx: 600, cy: 520, s: 2.15, ry: -3, rx: 4 },
  { t: 2.6, cx: 330, cy: 690, s: 1.85, ry: 7, rx: 2 },
  { t: 4.2, cx: 860, cy: 540, s: 0.95, ry: 3, rx: 1.5 },
  { t: 7.0, cx: 860, cy: 330, s: 1.24, ry: -1.5, rx: 0 },
];
function camera(t) {
  const K = KEYS, n = K.length;
  t = clamp(t, K[0].t, K[n - 1].t);
  let i = 0; while (i < n - 2 && t > K[i + 1].t) i++;
  const a = K[i], b = K[i + 1], h = b.t - a.t, u = (t - a.t) / h;
  const out = {};
  for (const k of ['cx', 'cy', 's', 'ry', 'rx']) {
    const v = (j) => k === 's' ? Math.log(K[j][k]) : K[j][k];
    const tan = j => {
      if (j === 0) return (v(1) - v(0)) / (K[1].t - K[0].t) * 0.6;
      if (j === n - 1) return 0;
      return (v(j + 1) - v(j - 1)) / (K[j + 1].t - K[j - 1].t);
    };
    const p0 = v(i), p1 = v(i + 1), m0 = tan(i) * h, m1 = tan(i + 1) * h;
    const u2 = u * u, u3 = u2 * u;
    const r = (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1;
    out[k] = k === 's' ? Math.exp(r) : r;
  }
  return out;
}

/* ── fios: [de, até, início, fim] (pontos no quadro) ── */
const P = {
  mrr: [860, 270], post: [246, 358], funil: [268, 646], meta: [492, 552], carimbo: [320, 968], crm: [1330, 278],
  churn: [1600, 346], ltv: [1360, 642], leads: [1440, 818], nota: [818, 818], bo: [1140, 874],
};
const FIOS = [['mrr', 'post', 0.45, 1.35], ['post', 'funil', 1.3, 2.15], ['funil', 'meta', 2.0, 2.55], ['funil', 'carimbo', 2.3, 2.9],
  ['mrr', 'nota', 2.7, 3.3], ['mrr', 'crm', 2.9, 3.7], ['crm', 'churn', 3.35, 3.85], ['mrr', 'ltv', 3.1, 3.9], ['ltv', 'leads', 3.6, 4.25], ['nota', 'bo', 3.8, 4.3]];
const svgNS = 'http://www.w3.org/2000/svg';
const fios = $('#fios');
const caminhos = FIOS.map(([a, b]) => {
  const [x0, y0] = P[a], [x1, y1] = P[b];
  const d = Math.hypot(x1 - x0, y1 - y0), mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + d * 0.06;   // o fio cede um pouco
  const path = `M${x0} ${y0} Q${mx} ${my} ${x1} ${y1}`;
  const s = document.createElementNS(svgNS, 'path'); s.setAttribute('d', path); s.setAttribute('class', 'fio-s'); s.setAttribute('pathLength', 1);
  s.setAttribute('transform', 'translate(5 9)');
  const f = document.createElementNS(svgNS, 'path'); f.setAttribute('d', path); f.setAttribute('class', 'fio'); f.setAttribute('pathLength', 1);
  for (const e of [s, f]) { e.style.strokeDasharray = '1 1'; e.style.strokeDashoffset = 1; fios.appendChild(e); }
  return [s, f];
});
const pinos = $('#pinos');
for (const k in P) { const d = document.createElement('div'); d.className = 'pino p'; d.style.left = P[k][0] + 'px'; d.style.top = P[k][1] + 'px'; pinos.appendChild(d); }

/* ── primeiro plano: cordas desfocadas (paralaxe forte) ── */
$('#frente').innerHTML = `
  <defs><filter id="desf" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="13"/></filter>
  <linearGradient id="cordaG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b4a2c"/><stop offset=".5" stop-color="#a77c4f"/><stop offset="1" stop-color="#4a301b"/></linearGradient></defs>
  <g id="cordas" filter="url(#desf)">
    <path d="M-160 330 C 120 250, 380 120, 640 -140" stroke="url(#cordaG)" stroke-width="58" fill="none" stroke-linecap="round"/>
    <path d="M-160 330 C 120 250, 380 120, 640 -140" stroke="#2a1a0c" stroke-width="54" fill="none" stroke-dasharray="7 15" opacity=".55"/>
    <path d="M2120 690 C 1900 760, 1760 960, 1700 1260" stroke="url(#cordaG)" stroke-width="66" fill="none" stroke-linecap="round"/>
    <path d="M2120 690 C 1900 760, 1760 960, 1700 1260" stroke="#2a1a0c" stroke-width="62" fill="none" stroke-dasharray="8 16" opacity=".55"/>
  </g>`;

/* ── poeira no feixe de luz e grão de filme (determinísticos por quadro) ── */
const rnd = s => { let x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const POEIRA = Array.from({ length: 70 }, (_, i) => ({ x: rnd(i) * 1920, y: rnd(i + 100) * 1080, r: 1 + rnd(i + 200) * 2.6, vx: (rnd(i + 300) - .5) * 14, vy: -4 - rnd(i + 400) * 10, f: rnd(i + 500) * 6, z: .4 + rnd(i + 600) }));
const cp = $('#poeira').getContext('2d');
const cg = $('#grao').getContext('2d'), gImg = cg.createImageData(960, 540);

/* ── luz da lâmpada: pisca e acende ── */
function luzEm(t) {
  if (t < 0.10) return 0.08;
  const pisca = [[0.10, 0.9], [0.16, 0.15], [0.22, 1.0], [0.27, 0.35], [0.34, 1.0], [0.40, 0.6], [0.46, 1.0]];
  if (t < 0.46) { let v = 0.08; for (const [a, b] of pisca) if (t >= a) v = b; return v; }
  return 0.97 + 0.03 * Math.sin(t * 37) * Math.sin(t * 13.3);
}

window.quadro = function (t) {
  const c = camera(t);
  $('#mundo').style.transform = `translate3d(960px,540px,0) rotateX(${c.rx}deg) rotateY(${c.ry}deg) scale3d(${c.s},${c.s},${c.s}) translate3d(${-c.cx}px,${-c.cy}px,0)`;

  // painel de MRR: gráfico se desenha e o número sobe de 60k a 100k
  const g = cubicInOut(prog(t, 0.25, 1.45));
  $('#revelaR').setAttribute('width', 24 + g * 380);
  $('#mrrNum').textContent = 'R$ ' + Math.round(60 + 40 * g) + 'k';
  const pp = prog(t, 1.4, 1.75);
  $('#mrrPonto').setAttribute('opacity', pp > 0 ? 1 : 0); $('#mrrPonto').setAttribute('r', 9 * (pp > 0 ? backOut(pp) : 0));
